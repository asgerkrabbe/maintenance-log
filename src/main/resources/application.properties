spring.application.name=moto-maintenance
server.port=${APP_PORT:8080}

spring.datasource.url=jdbc:h2:file:${DB_FILE_PATH:./data/moto-maintenance}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=false

# Allow loading environment variables from a local .env file
# The .env file should be in the project root and use KEY=VALUE lines
spring.config.import=optional:file:.env[.properties]
