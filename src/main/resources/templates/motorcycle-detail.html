<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Motorcycle Detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Moto Maintenance</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">Dashboard</a>
            <a class="nav-link active" href="/motorcycles">Motorcycles</a>
            <a class="nav-link" href="/templates">Templates</a>
            <a class="nav-link" href="/upcoming">Upcoming</a>
            <a class="nav-link" href="/data/export">Export</a>
        </div>
    </div>
</nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 th:text="${motorcycle.nickname}"></h1>
        <div>
            <a class="btn btn-secondary" th:href="@{'/motorcycles/' + ${motorcycle.id} + '/edit'}">Edit</a>
            <a class="btn btn-primary" th:href="@{'/motorcycles/' + ${motorcycle.id} + '/records/new'}">Add Record</a>
        </div>
    </div>
    <p class="text-muted" th:text="${motorcycle.make} + ' ' + ${motorcycle.model} + ' (' + ${motorcycle.year} + ')'" ></p>
    <p><strong>Odometer:</strong> <span th:text="${motorcycle.currentOdometerKm}"></span> km</p>

    <h3>Upcoming Tasks</h3>
    <table class="table">
        <thead><tr><th>Name</th><th>Due Odometer</th><th>Due Date</th><th>Status</th></tr></thead>
        <tbody>
        <tr th:each="task : ${tasks}">
            <td th:text="${task.template.name}"></td>
            <td th:text="${task.nextDueOdometerKm}"></td>
            <td th:text="${task.nextDueDate}"></td>
            <td><span class="badge" th:classappend="${task.status.name() == 'OVERDUE' ? 'bg-danger' : task.status.name() == 'DUE_SOON' ? 'bg-warning text-dark' : 'bg-success'}" th:text="${task.status}"></span></td>
        </tr>
        </tbody>
    </table>

    <h5>Attach Template</h5>
    <form th:action="@{'/motorcycles/' + ${motorcycle.id} + '/attach-template'}" th:object="${attachForm}" method="post" class="row g-2 mb-4">
        <div class="col-auto">
            <select class="form-select" th:field="*{templateId}">
                <option th:each="t : ${templates}" th:value="${t.id}" th:text="${t.name}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-primary" type="submit">Attach</button>
        </div>
    </form>

    <h3>History</h3>
    <table class="table table-striped">
        <thead><tr><th>Date</th><th>Odometer</th><th>Category</th><th>Title</th><th>Cost</th></tr></thead>
        <tbody>
        <tr th:each="rec : ${records}">
            <td th:text="${rec.date}"></td>
            <td th:text="${rec.odometerKm}"></td>
            <td th:text="${rec.category}"></td>
            <td th:text="${rec.title}"></td>
            <td th:text="${(rec.costParts ?: 0) + (rec.costLabor ?: 0)}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
