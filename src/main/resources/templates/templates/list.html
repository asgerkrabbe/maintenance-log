<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Templates</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/navbar :: content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Maintenance Templates</h2>
        <a class="btn btn-primary" th:href="@{/templates/create}">Add Template</a>
    </div>
    <table class="table table-striped">
        <thead><tr><th>Name</th><th>Intervals</th><th>Category</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="t : ${templates}">
            <td th:text="${t.name}"></td>
            <td><span th:text="${t.intervalKm}"></span> km / <span th:text="${t.intervalMonths}"></span> months</td>
            <td th:text="${t.defaultCategory}"></td>
            <td>
                <a class="btn btn-sm btn-secondary" th:href="@{'/templates/' + ${t.id} + '/edit'}">Edit</a>
                <form th:action="@{'/templates/' + ${t.id} + '/delete'}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-danger" type="submit">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
