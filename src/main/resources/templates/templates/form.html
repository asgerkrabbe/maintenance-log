<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Template</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body>
<div th:replace="fragments/nav :: body"></div>
<div class="container">
    <h2 th:text="${templateDto.id == null} ? 'New Template' : 'Edit Template'"></h2>
    <form th:action="${templateDto.id == null} ? @{/templates} : @{'/templates/' + ${templateDto.id}}" method="post" th:object="${templateDto}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Name</label>
                <input class="form-control" type="text" th:field="*{name}" required />
            </div>
            <div class="col-md-6">
                <label class="form-label">Default Category</label>
                <input class="form-control" type="text" th:field="*{defaultCategory}" />
            </div>
            <div class="col-md-6">
                <label class="form-label">Interval Km</label>
                <input class="form-control" type="number" min="1" th:field="*{intervalKm}" />
            </div>
            <div class="col-md-6">
                <label class="form-label">Interval Months</label>
                <input class="form-control" type="number" min="1" th:field="*{intervalMonths}" />
            </div>
            <div class="col-12">
                <label class="form-label">Description</label>
                <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
            </div>
        </div>
        <div class="mt-3">
            <button class="btn btn-primary" type="submit">Save</button>
            <a class="btn btn-secondary" th:href="@{/templates}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
