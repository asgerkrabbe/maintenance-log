<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Template</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/navbar :: content">
    <h2 th:text="${template.id} != null ? 'Edit Template' : 'Add Template'"></h2>
    <form th:action="@{/templates}" th:object="${template}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input class="form-control" th:field="*{name}" required />
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" th:field="*{description}"></textarea>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Interval Km</label>
                <input class="form-control" type="number" th:field="*{intervalKm}" />
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Interval Months</label>
                <input class="form-control" type="number" th:field="*{intervalMonths}" />
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Default Category</label>
            <input class="form-control" th:field="*{defaultCategory}" />
        </div>
        <button class="btn btn-primary" type="submit">Save</button>
    </form>
</div>
</body>
</html>
