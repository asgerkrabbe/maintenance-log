<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Upcoming Tasks</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/navbar :: content">
    <h2>Upcoming Maintenance</h2>
    <table class="table table-striped">
        <thead><tr><th>Motorcycle</th><th>Task</th><th>Due Km</th><th>Due Date</th><th>Status</th></tr></thead>
        <tbody>
        <tr th:each="t : ${tasks}">
            <td th:text="${t.motorcycle.nickname}"></td>
            <td th:text="${t.template.name}"></td>
            <td th:text="${t.nextDueOdometerKm}"></td>
            <td th:text="${t.nextDueDate}"></td>
            <td><span class="badge" th:classappend="${t.status == T(com.example.moto.entity.TaskStatus).OVERDUE} ? 'text-bg-danger' : (t.status == T(com.example.moto.entity.TaskStatus).DUE_SOON ? 'text-bg-warning' : 'text-bg-success')" th:text="${t.status}"></span></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
