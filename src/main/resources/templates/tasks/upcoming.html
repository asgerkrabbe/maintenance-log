<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Upcoming Tasks</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body>
<div th:replace="fragments/nav :: body"></div>
<div class="container">
    <h2>Upcoming Maintenance</h2>
    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>Motorcycle</th>
                <th>Task</th>
                <th>Due Date</th>
                <th>Due Odometer</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="task : ${tasks}">
                <td th:text="${task.motorcycle.nickname}"></td>
                <td th:text="${task.template.name}"></td>
                <td th:text="${task.nextDueDate}"></td>
                <td th:text="${task.nextDueOdometerKm}"></td>
                <td>
                    <span th:classappend="${task.status.name() == 'OVERDUE'} ? 'badge bg-danger' : (task.status.name() == 'DUE_SOON' ? 'badge bg-warning text-dark' : 'badge bg-success')"
                          th:text="${task.status}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
