<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="layout :: body">
<h2>Upcoming Maintenance</h2>
<form class="mb-3" method="get">
    <label class="form-label">Filter status</label>
    <select name="status" class="form-select w-auto d-inline" th:value="${filterStatus}">
        <option value="">All</option>
        <option>OK</option>
        <option>DUE_SOON</option>
        <option>OVERDUE</option>
    </select>
    <button class="btn btn-secondary" type="submit">Apply</button>
</form>
<table class="table table-striped">
    <thead><tr><th>Motorcycle</th><th>Task</th><th>Due Odometer</th><th>Due Date</th><th>Status</th></tr></thead>
    <tbody>
    <tr th:each="task : ${tasks}">
        <td th:text="${task.motorcycle.nickname}"></td>
        <td th:text="${task.template.name}"></td>
        <td th:text="${task.nextDueOdometerKm}"></td>
        <td th:text="${task.nextDueDate}"></td>
        <td><span th:text="${task.status}" th:classappend="${'badge status-' + task.status}"></span></td>
    </tr>
    </tbody>
</table>
</body>
</html>
