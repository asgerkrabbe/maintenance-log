<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Maintenance Record</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Moto Maintenance</a>
    </div>
</nav>
<div class="container">
    <h1>Add Maintenance Record</h1>
    <form th:action="@{'/motorcycles/' + ${record.motorcycleId} + '/records'}" th:object="${record}" method="post">
        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Date</label>
                <input class="form-control" type="date" th:field="*{date}" />
            </div>
            <div class="col">
                <label class="form-label">Odometer (km)</label>
                <input class="form-control" type="number" th:field="*{odometerKm}" />
            </div>
            <div class="col">
                <label class="form-label">Category</label>
                <input class="form-control" th:field="*{category}" />
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input class="form-control" th:field="*{title}" />
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" th:field="*{description}"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Parts Used</label>
            <textarea class="form-control" th:field="*{partsUsed}"></textarea>
        </div>
        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Parts Cost</label>
                <input class="form-control" type="number" step="0.01" th:field="*{costParts}" />
            </div>
            <div class="col">
                <label class="form-label">Labor Cost</label>
                <input class="form-control" type="number" step="0.01" th:field="*{costLabor}" />
            </div>
            <div class="col">
                <label class="form-label">Workshop</label>
                <input class="form-control" th:field="*{workshop}" />
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Related Template</label>
            <select class="form-select" th:field="*{templateId}">
                <option th:value="" selected>None</option>
                <option th:each="t : ${templates}" th:value="${t.id}" th:text="${t.name}"></option>
            </select>
        </div>
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-secondary" th:href="@{'/motorcycles/' + ${record.motorcycleId}}">Cancel</a>
    </form>
</div>
</body>
</html>
