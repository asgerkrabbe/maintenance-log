<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Templates</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Moto Maintenance</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">Dashboard</a>
            <a class="nav-link" href="/motorcycles">Motorcycles</a>
            <a class="nav-link active" href="/templates">Templates</a>
            <a class="nav-link" href="/upcoming">Upcoming</a>
            <a class="nav-link" href="/data/export">Export</a>
        </div>
    </div>
</nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Templates</h1>
        <a class="btn btn-primary" href="/templates/new">Add Template</a>
    </div>
    <table class="table table-striped">
        <thead><tr><th>Name</th><th>Interval Km</th><th>Interval Months</th><th>Category</th><th></th></tr></thead>
        <tbody>
        <tr th:each="t : ${templates}">
            <td th:text="${t.name}"></td>
            <td th:text="${t.intervalKm}"></td>
            <td th:text="${t.intervalMonths}"></td>
            <td th:text="${t.defaultCategory}"></td>
            <td>
                <a class="btn btn-sm btn-outline-primary" th:href="@{'/templates/' + ${t.id} + '/edit'}">Edit</a>
                <form th:action="@{'/templates/' + ${t.id} + '/delete'}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
