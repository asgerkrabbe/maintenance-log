<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="layout :: body">
<h2 th:text="${template.id} != null ? 'Edit Template' : 'New Template'"></h2>
<form th:action="${template.id} != null ? @{'/templates/' + ${template.id}} : @{/templates}" th:object="${template}" method="post">
    <div class="row">
        <div class="col-md-6">
            <div class="mb-3"><label class="form-label">Name</label><input class="form-control" th:field="*{name}" required></div>
            <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" th:field="*{description}"></textarea></div>
            <div class="mb-3"><label class="form-label">Interval Km</label><input class="form-control" type="number" th:field="*{intervalKm}"></div>
            <div class="mb-3"><label class="form-label">Interval Months</label><input class="form-control" type="number" th:field="*{intervalMonths}"></div>
            <div class="mb-3"><label class="form-label">Default Category</label><input class="form-control" th:field="*{defaultCategory}"></div>
        </div>
    </div>
    <button class="btn btn-primary" type="submit">Save</button>
</form>
</body>
</html>
