<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Template</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Moto Maintenance</a>
    </div>
</nav>
<div class="container">
    <h1 th:text="${template.id} != null ? 'Edit Template' : 'Add Template'"></h1>
    <form th:action="${template.id} != null ? @{'/templates/' + ${template.id}} : @{/templates}" th:object="${template}" method="post">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input class="form-control" th:field="*{name}" />
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" th:field="*{description}"></textarea>
        </div>
        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Interval Km</label>
                <input class="form-control" type="number" th:field="*{intervalKm}" />
            </div>
            <div class="col">
                <label class="form-label">Interval Months</label>
                <input class="form-control" type="number" th:field="*{intervalMonths}" />
            </div>
            <div class="col">
                <label class="form-label">Default Category</label>
                <input class="form-control" th:field="*{defaultCategory}" />
            </div>
        </div>
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-secondary" href="/templates">Cancel</a>
    </form>
</div>
</body>
</html>
