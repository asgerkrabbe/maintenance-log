<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Motorcycle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body>
<div th:replace="fragments/nav :: body"></div>
<div class="container">
    <h2 th:text="${motorcycleDto.id == null} ? 'Add Motorcycle' : 'Edit Motorcycle'"></h2>
    <form th:action="${motorcycleDto.id == null} ? @{/motorcycles} : @{'/motorcycles/' + ${motorcycleDto.id}}" method="post" th:object="${motorcycleDto}">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Nickname</label>
                <input class="form-control" type="text" th:field="*{nickname}" required />
            </div>
            <div class="col-md-4">
                <label class="form-label">Make</label>
                <input class="form-control" type="text" th:field="*{make}" required />
            </div>
            <div class="col-md-4">
                <label class="form-label">Model</label>
                <input class="form-control" type="text" th:field="*{model}" required />
            </div>
            <div class="col-md-3">
                <label class="form-label">Year</label>
                <input class="form-control" type="number" th:field="*{year}" min="1900" max="2100" required />
            </div>
            <div class="col-md-3">
                <label class="form-label">Engine Size (cc)</label>
                <input class="form-control" type="number" th:field="*{engineSizeCc}" min="0" required />
            </div>
            <div class="col-md-3">
                <label class="form-label">Current Odometer (km)</label>
                <input class="form-control" type="number" th:field="*{currentOdometerKm}" min="0" required />
            </div>
            <div class="col-md-3">
                <label class="form-label">Purchase Date</label>
                <input class="form-control" type="date" th:field="*{purchaseDate}" />
            </div>
            <div class="col-md-6">
                <label class="form-label">VIN</label>
                <input class="form-control" type="text" th:field="*{vin}" />
            </div>
            <div class="col-md-6">
                <label class="form-label">License Plate</label>
                <input class="form-control" type="text" th:field="*{licensePlate}" />
            </div>
            <div class="col-12">
                <label class="form-label">Notes</label>
                <textarea class="form-control" th:field="*{notes}" rows="3"></textarea>
            </div>
        </div>
        <div class="mt-3">
            <button class="btn btn-primary" type="submit">Save</button>
            <a class="btn btn-secondary" th:href="@{/motorcycles}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
