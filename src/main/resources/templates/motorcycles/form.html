<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Motorcycle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/navbar :: content">
    <h2 th:text="${motorcycle.id} != null ? 'Edit Motorcycle' : 'Add Motorcycle'"></h2>
    <form th:action="@{/motorcycles}" th:object="${motorcycle}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Nickname</label>
                <input class="form-control" th:field="*{nickname}" required />
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Make</label>
                <input class="form-control" th:field="*{make}" required />
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Model</label>
                <input class="form-control" th:field="*{model}" required />
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Year</label>
                <input class="form-control" type="number" th:field="*{year}" />
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Engine CC</label>
                <input class="form-control" type="number" th:field="*{engineSizeCc}" />
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">VIN</label>
                <input class="form-control" th:field="*{vin}" />
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">License Plate</label>
                <input class="form-control" th:field="*{licensePlate}" />
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Purchase Date</label>
                <input class="form-control" type="date" th:field="*{purchaseDate}" />
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Current Odometer (km)</label>
                <input class="form-control" type="number" th:field="*{currentOdometerKm}" />
            </div>
            <div class="col-md-8 mb-3">
                <label class="form-label">Notes</label>
                <textarea class="form-control" th:field="*{notes}"></textarea>
            </div>
        </div>
        <button class="btn btn-primary" type="submit">Save</button>
    </form>
</div>
</body>
</html>
