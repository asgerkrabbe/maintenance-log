<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Motorcycles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/navbar :: content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Motorcycles</h2>
        <a class="btn btn-primary" th:href="@{/motorcycles/create}">Add Motorcycle</a>
    </div>
    <table class="table table-striped">
        <thead><tr><th>Nickname</th><th>Make/Model</th><th>Odometer</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="m : ${motorcycles}">
            <td th:text="${m.nickname}"></td>
            <td th:text="${m.make + ' ' + m.model}"></td>
            <td th:text="${m.currentOdometerKm}"></td>
            <td>
                <a class="btn btn-sm btn-secondary" th:href="@{'/motorcycles/' + ${m.id} + '/edit'}">Edit</a>
                <a class="btn btn-sm btn-primary" th:href="@{'/motorcycles/' + ${m.id}}">Details</a>
                <form th:action="@{'/motorcycles/' + ${m.id} + '/delete'}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-danger" type="submit">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
