<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Motorcycles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body>
<div th:replace="fragments/nav :: body"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Motorcycles</h2>
        <a class="btn btn-primary" th:href="@{/motorcycles/new}">Add Motorcycle</a>
    </div>
    <table class="table table-hover">
        <thead>
        <tr>
            <th>Nickname</th>
            <th>Make</th>
            <th>Model</th>
            <th>Year</th>
            <th>Odometer</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${motorcycles}">
            <td th:text="${m.nickname}"></td>
            <td th:text="${m.make}"></td>
            <td th:text="${m.model}"></td>
            <td th:text="${m.year}"></td>
            <td th:text="${m.currentOdometerKm}"></td>
            <td>
                <a class="btn btn-sm btn-outline-primary" th:href="@{'/motorcycles/' + ${m.id}}">Details</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
