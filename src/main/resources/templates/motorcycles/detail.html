<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Motorcycle Detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body>
<div th:replace="fragments/nav :: body"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 th:text="${motorcycle.nickname}"></h2>
            <p class="text-muted" th:text="${motorcycle.make + ' ' + motorcycle.model + ' (' + motorcycle.year + ')'}"></p>
            <p><strong>Odometer:</strong> <span th:text="${motorcycle.currentOdometerKm}"></span> km</p>
        </div>
        <div>
            <a class="btn btn-outline-primary" th:href="@{'/motorcycles/' + ${motorcycle.id} + '/edit'}">Edit</a>
            <form th:action="@{'/motorcycles/' + ${motorcycle.id} + '/delete'}" method="post" class="d-inline">
                <button class="btn btn-outline-danger" type="submit">Delete</button>
            </form>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-lg-6">
            <h4>Upcoming Tasks</h4>
            <form class="row g-2 mb-2" th:action="@{'/motorcycles/' + ${motorcycle.id} + '/attach-template'}" method="post" th:object="${attachDto}">
                <div class="col-8">
                    <select class="form-select" th:field="*{templateId}">
                        <option th:each="t : ${templates}" th:value="${t.id}" th:text="${t.name}"></option>
                    </select>
                </div>
                <div class="col-4">
                    <button class="btn btn-success w-100" type="submit">Attach Template</button>
                </div>
            </form>
            <div class="table-responsive">
                <table class="table table-sm">
                    <thead>
                    <tr>
                        <th>Task</th>
                        <th>Due</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="task : ${tasks}">
                        <td th:text="${task.template.name}"></td>
                        <td>
                            <div th:text="${task.nextDueOdometerKm != null ? 'at ' + task.nextDueOdometerKm + ' km' : ''}"></div>
                            <div th:text="${task.nextDueDate != null ? 'by ' + task.nextDueDate : ''}"></div>
                        </td>
                        <td>
                            <span th:classappend="${task.status.name() == 'OVERDUE'} ? 'badge bg-danger' : (task.status.name() == 'DUE_SOON' ? 'badge bg-warning text-dark' : 'badge bg-success')"
                                  th:text="${task.status}"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="col-lg-6">
            <h4>Add Maintenance Record</h4>
            <form th:action="@{'/motorcycles/' + ${motorcycle.id} + '/records'}" method="post" th:object="${recordDto}">
                <div class="row g-2">
                    <div class="col-md-6">
                        <label class="form-label">Date</label>
                        <input class="form-control" type="date" th:field="*{date}" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Odometer (km)</label>
                        <input class="form-control" type="number" min="0" th:field="*{odometerKm}" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Category</label>
                        <input class="form-control" type="text" th:field="*{category}" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Title</label>
                        <input class="form-control" type="text" th:field="*{title}" />
                    </div>
                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" th:field="*{description}" rows="2"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Parts Used</label>
                        <input class="form-control" type="text" th:field="*{partsUsed}" />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Cost Parts</label>
                        <input class="form-control" type="number" step="0.01" th:field="*{costParts}" />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Cost Labor</label>
                        <input class="form-control" type="number" step="0.01" th:field="*{costLabor}" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Workshop</label>
                        <input class="form-control" type="text" th:field="*{workshop}" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Update Task</label>
                        <select class="form-select" th:field="*{templateInstanceId}">
                            <option value="">-- Optional --</option>
                            <option th:each="inst : ${instances}" th:value="${inst.id}" th:text="${inst.template.name}"></option>
                        </select>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary" type="submit">Save Record</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="mb-3">
        <h4>Maintenance History</h4>
        <div class="mb-2">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{'/motorcycles/' + ${motorcycle.id}}">All</a>
            <a class="btn btn-sm btn-outline-secondary" th:href="@{'/motorcycles/' + ${motorcycle.id} + '?category=oil'}">Oil</a>
            <a class="btn btn-sm btn-outline-secondary" th:href="@{'/motorcycles/' + ${motorcycle.id} + '?category=tires'}">Tires</a>
            <a class="btn btn-sm btn-outline-secondary" th:href="@{'/motorcycles/' + ${motorcycle.id} + '?category=brakes'}">Brakes</a>
        </div>
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Odometer</th>
                    <th>Category</th>
                    <th>Title</th>
                    <th>Cost</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="rec : ${records}">
                    <td th:text="${rec.date}"></td>
                    <td th:text="${rec.odometerKm}"></td>
                    <td th:text="${rec.category}"></td>
                    <td th:text="${rec.title}"></td>
                    <td th:text="${(rec.costParts != null ? rec.costParts : 0) + (rec.costLabor != null ? rec.costLabor : 0)}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
