<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Motorcycle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/navbar :: content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="${motorcycle.nickname}"></h2>
        <div>
            <a class="btn btn-secondary" th:href="@{'/motorcycles/' + ${motorcycle.id} + '/edit'}">Edit</a>
            <a class="btn btn-primary" th:href="@{'/records/create?(motorcycleId=' + ${motorcycle.id} + ')'}">Add Record</a>
        </div>
    </div>
    <div class="mb-3">
        <p><strong>Make/Model:</strong> <span th:text="${motorcycle.make + ' ' + motorcycle.model}"></span> (<span th:text="${motorcycle.year}"></span>)</p>
        <p><strong>Odometer:</strong> <span th:text="${motorcycle.currentOdometerKm}"></span> km</p>
        <p><strong>Notes:</strong> <span th:text="${motorcycle.notes}"></span></p>
    </div>

    <h4>Upcoming Tasks</h4>
    <form class="row mb-3" th:action="@{'/motorcycles/' + ${motorcycle.id} + '/attach-template'}" method="post" th:object="${attach}">
        <div class="col-md-6">
            <select class="form-select" th:field="*{templateId}">
                <option th:each="t : ${templates}" th:value="${t.id}" th:text="${t.name}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary" type="submit">Attach Template</button>
        </div>
    </form>
    <table class="table table-bordered">
        <thead><tr><th>Template</th><th>Due Odometer</th><th>Due Date</th><th>Status</th></tr></thead>
        <tbody>
        <tr th:each="i : ${instances}">
            <td th:text="${i.template.name}"></td>
            <td th:text="${i.nextDueOdometerKm}"></td>
            <td th:text="${i.nextDueDate}"></td>
            <td><span class="badge" th:classappend="${i.status == T(com.example.moto.entity.TaskStatus).OVERDUE} ? 'text-bg-danger' : (i.status == T(com.example.moto.entity.TaskStatus).DUE_SOON ? 'text-bg-warning' : 'text-bg-success')" th:text="${i.status}"></span></td>
        </tr>
        </tbody>
    </table>

    <h4>Maintenance History</h4>
    <table class="table table-striped">
        <thead><tr><th>Date</th><th>Odometer</th><th>Category</th><th>Title</th><th>Total Cost</th></tr></thead>
        <tbody>
        <tr th:each="r : ${records}">
            <td th:text="${r.date}"></td>
            <td th:text="${r.odometerKm}"></td>
            <td th:text="${r.category}"></td>
            <td th:text="${r.title}"></td>
            <td th:text="${(r.costParts?:0) + (r.costLabor?:0)}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
