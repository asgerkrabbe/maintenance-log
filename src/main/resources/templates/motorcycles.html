<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Motorcycles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Moto Maintenance</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">Dashboard</a>
            <a class="nav-link active" href="/motorcycles">Motorcycles</a>
            <a class="nav-link" href="/templates">Templates</a>
            <a class="nav-link" href="/upcoming">Upcoming</a>
            <a class="nav-link" href="/data/export">Export</a>
        </div>
    </div>
</nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Motorcycles</h1>
        <a class="btn btn-primary" href="/motorcycles/new">Add Motorcycle</a>
    </div>
    <table class="table table-striped">
        <thead><tr><th>Nickname</th><th>Make</th><th>Model</th><th>Year</th><th>Odometer</th><th></th></tr></thead>
        <tbody>
        <tr th:each="moto : ${motorcycles}">
            <td th:text="${moto.nickname}"></td>
            <td th:text="${moto.make}"></td>
            <td th:text="${moto.model}"></td>
            <td th:text="${moto.year}"></td>
            <td th:text="${moto.currentOdometerKm}"></td>
            <td>
                <a class="btn btn-sm btn-outline-primary" th:href="@{'/motorcycles/' + ${moto.id}}">View</a>
                <form th:action="@{'/motorcycles/' + ${moto.id} + '/delete'}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
