<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="layout :: body">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Motorcycles</h2>
    <a class="btn btn-primary" th:href="@{/motorcycles/new}">Add Motorcycle</a>
</div>
<table class="table table-striped">
    <thead>
    <tr><th>Nickname</th><th>Make/Model</th><th>Year</th><th>Odometer</th><th></th></tr>
    </thead>
    <tbody>
    <tr th:each="moto : ${motorcycles}">
        <td th:text="${moto.nickname}"></td>
        <td th:text="${moto.make + ' ' + moto.model}"></td>
        <td th:text="${moto.year}"></td>
        <td th:text="${moto.currentOdometerKm}"></td>
        <td>
            <a class="btn btn-sm btn-primary" th:href="@{'/motorcycles/' + ${moto.id}}">View</a>
            <a class="btn btn-sm btn-secondary" th:href="@{'/motorcycles/' + ${moto.id} + '/edit'}">Edit</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
