<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Motorcycle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Moto Maintenance</a>
    </div>
</nav>
<div class="container">
    <h1 th:text="${motorcycle.id} != null ? 'Edit Motorcycle' : 'Add Motorcycle'"></h1>
    <form th:action="${motorcycle.id} != null ? @{'/motorcycles/' + ${motorcycle.id}} : @{/motorcycles}" th:object="${motorcycle}" method="post">
        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Nickname</label>
                <input class="form-control" th:field="*{nickname}" />
            </div>
            <div class="col">
                <label class="form-label">Make</label>
                <input class="form-control" th:field="*{make}" />
            </div>
            <div class="col">
                <label class="form-label">Model</label>
                <input class="form-control" th:field="*{model}" />
            </div>
        </div>
        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Year</label>
                <input class="form-control" type="number" th:field="*{year}" />
            </div>
            <div class="col">
                <label class="form-label">Engine Size (cc)</label>
                <input class="form-control" type="number" th:field="*{engineSizeCc}" />
            </div>
            <div class="col">
                <label class="form-label">Current Odometer (km)</label>
                <input class="form-control" type="number" th:field="*{currentOdometerKm}" />
            </div>
        </div>
        <div class="row mb-3">
            <div class="col">
                <label class="form-label">VIN</label>
                <input class="form-control" th:field="*{vin}" />
            </div>
            <div class="col">
                <label class="form-label">License Plate</label>
                <input class="form-control" th:field="*{licensePlate}" />
            </div>
            <div class="col">
                <label class="form-label">Purchase Date</label>
                <input class="form-control" type="date" th:field="*{purchaseDate}" />
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Notes</label>
            <textarea class="form-control" th:field="*{notes}"></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-secondary" href="/motorcycles">Cancel</a>
    </form>
</div>
</body>
</html>
