<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/navbar :: content">
    <h1>Dashboard</h1>
    <table class="table table-striped">
        <thead>
        <tr><th>Nickname</th><th>Bike</th><th>Odometer (km)</th><th>Next Task</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <tr th:each="m : ${motorcycles}">
            <td th:text="${m.nickname}"></td>
            <td><span th:text="${m.make}"></span> <span th:text="${m.model}"></span> (<span th:text="${m.year}"></span>)</td>
            <td th:text="${m.currentOdometerKm}"></td>
            <td>
                <span th:with="up=${instanceService.findUpcomingForMoto(m).orElse(null)}">
                    <span th:if="${up != null}" th:text="${up.template.name} + ' due at ' + ${up.nextDueOdometerKm} + ' km or ' + ${up.nextDueDate}"></span>
                    <span th:if="${up == null}">None</span>
                </span>
            </td>
            <td><a class="btn btn-sm btn-primary" th:href="@{'/motorcycles/' + ${m.id}}">View</a></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
