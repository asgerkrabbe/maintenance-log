<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Moto Maintenance</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">Dashboard</a>
            <a class="nav-link" href="/motorcycles">Motorcycles</a>
            <a class="nav-link" href="/templates">Templates</a>
            <a class="nav-link" href="/upcoming">Upcoming</a>
            <a class="nav-link" href="/data/export">Export</a>
        </div>
    </div>
</nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Dashboard</h1>
        <a class="btn btn-primary" href="/motorcycles/new">Add Motorcycle</a>
    </div>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Nickname</th><th>Make</th><th>Model</th><th>Year</th><th>Odometer (km)</th><th>Next Task</th><th>Overdue</th><th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="moto : ${motorcycles}">
            <td th:text="${moto.nickname}"></td>
            <td th:text="${moto.make}"></td>
            <td th:text="${moto.model}"></td>
            <td th:text="${moto.year}"></td>
            <td th:text="${moto.currentOdometerKm}"></td>
            <td th:text="${nextTask[moto.id] != null ? nextTask[moto.id].template.name + ' due at ' + (nextTask[moto.id].nextDueOdometerKm != null ? nextTask[moto.id].nextDueOdometerKm + ' km ' : '') + (nextTask[moto.id].nextDueDate != null ? 'or ' + nextTask[moto.id].nextDueDate : '') : 'None'}"></td>
            <td>
                <span class="badge bg-danger" th:text="${overdueCount[moto.id] != null ? overdueCount[moto.id] : 0}"></span>
            </td>
            <td><a class="btn btn-sm btn-outline-primary" th:href="@{'/motorcycles/' + ${moto.id}}">Details</a></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
