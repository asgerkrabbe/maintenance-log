<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body>
<div th:replace="fragments/nav :: body"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Motorcycle Dashboard</h2>
        <a class="btn btn-primary" th:href="@{/motorcycles/new}">Add Motorcycle</a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>Nickname</th>
                <th>Make/Model</th>
                <th>Year</th>
                <th>Odometer (km)</th>
                <th>Next Task</th>
                <th>Overdue</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${motorcycles}">
                <td th:text="${item.motorcycle.nickname}"></td>
                <td th:text="${item.motorcycle.make + ' ' + item.motorcycle.model}"></td>
                <td th:text="${item.motorcycle.year}"></td>
                <td th:text="${item.motorcycle.currentOdometerKm}"></td>
                <td>
                    <div th:if="${item.nextTask != null}">
                        <div th:text="${item.nextTask.template.name}"></div>
                        <small th:text="${#strings.arrayJoin(new String[]{item.nextTask.nextDueOdometerKm != null ? 'at ' + item.nextTask.nextDueOdometerKm + ' km' : '', item.nextTask.nextDueDate != null ? 'by ' + item.nextTask.nextDueDate : ''}, ' ')}"></small>
                    </div>
                    <span th:if="${item.nextTask == null}" class="text-muted">No tasks</span>
                </td>
                <td><span class="badge bg-danger" th:text="${item.overdueCount}"></span></td>
                <td><a class="btn btn-sm btn-outline-primary" th:href="@{'/motorcycles/' + ${item.motorcycle.id}}">View</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
