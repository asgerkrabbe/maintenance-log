<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Upcoming Maintenance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Moto Maintenance</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">Dashboard</a>
            <a class="nav-link" href="/motorcycles">Motorcycles</a>
            <a class="nav-link" href="/templates">Templates</a>
            <a class="nav-link active" href="/upcoming">Upcoming</a>
            <a class="nav-link" href="/data/export">Export</a>
        </div>
    </div>
</nav>
<div class="container">
    <h1>Upcoming Maintenance</h1>
    <table class="table table-striped">
        <thead><tr><th>Motorcycle</th><th>Task</th><th>Due Odometer</th><th>Due Date</th><th>Status</th></tr></thead>
        <tbody>
        <tr th:each="task : ${tasks}">
            <td th:text="${task.motorcycle.nickname}"></td>
            <td th:text="${task.template.name}"></td>
            <td th:text="${task.nextDueOdometerKm}"></td>
            <td th:text="${task.nextDueDate}"></td>
            <td><span class="badge" th:classappend="${task.status.name() == 'OVERDUE' ? 'bg-danger' : task.status.name() == 'DUE_SOON' ? 'bg-warning text-dark' : 'bg-success'}" th:text="${task.status}"></span></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
