<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Maintenance Record</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/navbar :: content">
    <h2>Add Maintenance Record</h2>
    <form th:action="@{/records}" th:object="${record}" method="post">
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{motorcycleId}" />
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Date</label>
                <input class="form-control" type="date" th:field="*{date}" required />
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Odometer (km)</label>
                <input class="form-control" type="number" th:field="*{odometerKm}" required />
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Category</label>
                <input class="form-control" th:field="*{category}" />
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Template</label>
            <select class="form-select" th:field="*{templateId}">
                <option value="">-- none --</option>
                <option th:each="t : ${templates}" th:value="${t.id}" th:text="${t.name}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input class="form-control" th:field="*{title}" required />
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" th:field="*{description}"></textarea>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Parts Used</label>
                <textarea class="form-control" th:field="*{partsUsed}"></textarea>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Cost Parts</label>
                <input class="form-control" type="number" step="0.01" th:field="*{costParts}" />
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Cost Labor</label>
                <input class="form-control" type="number" step="0.01" th:field="*{costLabor}" />
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Workshop</label>
            <input class="form-control" th:field="*{workshop}" />
        </div>
        <button class="btn btn-primary" type="submit">Save</button>
    </form>
</div>
</body>
</html>
