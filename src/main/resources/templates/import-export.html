<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Import / Export</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body>
<div th:replace="fragments/nav :: body"></div>
<div class="container">
    <h2>Import / Export</h2>
    <div class="mb-3">
        <a class="btn btn-outline-primary" th:href="@{/import-export/export}">Download Export</a>
    </div>
    <div class="mb-3">
        <form th:action="@{/import-export/import}" method="post" enctype="multipart/form-data">
            <div class="mb-2">
                <label class="form-label">Import JSON</label>
                <input class="form-control" type="file" name="file" required />
            </div>
            <button class="btn btn-success" type="submit">Import</button>
            <div th:if="${param.success}" class="text-success mt-2">Import completed.</div>
        </form>
    </div>
</div>
</body>
</html>
