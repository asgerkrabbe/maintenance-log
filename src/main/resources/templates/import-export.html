<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Import / Export</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/navbar :: content">
    <h2>Import / Export</h2>
    <div class="mb-3">
        <a class="btn btn-primary" th:href="@{/export}">Download JSON Export</a>
    </div>
    <div class="mb-3">
        <form th:action="@{/import}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Upload Export JSON</label>
                <input type="file" class="form-control" name="file" required />
            </div>
            <button class="btn btn-secondary" type="submit">Import (overwrite)</button>
        </form>
    </div>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
</div>
</body>
</html>
