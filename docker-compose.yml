version: '3.8'
services:
  moto:
    build: .
    environment:
      - APP_PORT=8080
      - DB_FILE_PATH=/data/moto-maintenance
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
